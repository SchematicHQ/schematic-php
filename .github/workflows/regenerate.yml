name: Regenerate SDK

on:
  schedule:
    # Weekly on Monday at 10 AM UTC, the same slot as Regenerate SDKs in
    # schematichq/schematic-fern-config.
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: automated/regenerate-sdk

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A PAT makes the pull request start the required "Test" check;
          # pull requests authored by GITHUB_TOKEN do not trigger workflows.
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Report authentication
        run: |
          if [ "${{ secrets.GH_TOKEN != '' }}" = "true" ]; then
            echo "Authenticating with the org GH_TOKEN secret."
          else
            echo "::warning::GH_TOKEN is unavailable, so this run falls back to GITHUB_TOKEN and its pull request will not start the required Test check."
          fi

      - name: Setup Java # openapi-generator-cli runs on the JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock resolves dev dependencies that require PHP 8.4.
          php-version: '8.4'
          extensions: curl, json, mbstring
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check out the regeneration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            # Reuse a branch that is still under review instead of opening a
            # second pull request. Regenerating on top of it also keeps manual
            # fixes already made there, such as Schematic.php wiring.
            echo "Reusing existing branch $BRANCH."
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            echo "Creating branch $BRANCH from main."
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Regenerate from the OpenAPI spec
        env:
          # php-cs-fixer refuses to run on PHP newer than 8.3.
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: ./generate.sh

      - name: Commit regenerated code
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(generate): regenerate from the latest OpenAPI spec"
          else
            echo "Generated code already matches the spec."
          fi

          # Covers both the regeneration itself and any main commits merged in
          # above, so a refreshed branch still gets pushed.
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to propose; exiting without a pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git log origin/main..HEAD --oneline
          fi

      # Run the suite here rather than relying on the pull request: the required
      # "Test" check does not run when the pull request is authored by
      # GITHUB_TOKEN. Failures are reported in the body, not swallowed.
      - name: PHPUnit tests
        id: tests
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: vendor/bin/phpunit

      - name: Check for unwired API clients
        id: wiring
        if: steps.commit.outputs.changed == 'true'
        run: |
          # src/Schematic.php is hand-maintained and excluded from generation,
          # so a new FooApi class is generated but unreachable until wired up.
          # shellcheck disable=SC2012 # generated class names are plain ASCII
          unwired=$(comm -23 \
            <(ls src/Api/ | sed 's/\.php$//' | sort) \
            <(grep -oE 'new [A-Za-z]+Api\(' src/Schematic.php | sed 's/new //;s/(//' | sort))
          {
            echo "unwired<<EOF"
            echo "$unwired"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$unwired" ]; then
            echo "::warning::API clients missing from src/Schematic.php: $(echo "$unwired" | tr '\n' ' ')"
          else
            echo "Every class in src/Api/ is wired into src/Schematic.php."
          fi

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        run: git push origin "$BRANCH"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TESTS: ${{ steps.tests.outcome }}
          UNWIRED: ${{ steps.wiring.outputs.unwired }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          spec=$(grep '^inputSpec:' config.yaml | awk '{print $2}')

          {
            echo "Regenerated by \`./generate.sh\` from [\`$spec\`]($spec)."
            echo
            if [ "$TESTS" = "success" ]; then
              echo "- PHPUnit: :white_check_mark: passed ([run]($RUN_URL))"
            else
              echo "- PHPUnit: :x: failed ([run]($RUN_URL))"
            fi
            if [ -z "$UNWIRED" ]; then
              echo "- Client wiring: :white_check_mark: every class in \`src/Api/\` is reachable from \`src/Schematic.php\`"
            else
              echo "- Client wiring: :warning: missing from \`src/Schematic.php\`:"
              # shellcheck disable=SC2016 # `$/` is a sed anchor, not a variable
              echo "$UNWIRED" | sed 's/^/  - `/;s/$/`/'
              echo
              echo "\`src/Schematic.php\` is not regenerated. Add the \`use\` import, the public property, and the \`new FooApi(\$httpClient, \$config)\` line for each class above before merging."
            fi
            echo
            echo "This branch is reused by later runs while it stays open, so review comments survive a re-run but pushed fixes may be regenerated over."
          } > /tmp/pr-body.md

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
            echo "Updated the existing pull request for $BRANCH."
          else
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "chore(generate): regenerate from the latest OpenAPI spec" \
              --body-file /tmp/pr-body.md
          fi
